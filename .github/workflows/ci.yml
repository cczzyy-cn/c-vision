name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Build (tsc -> lib/index.js + lib/client.js)
        run: npm run build

      # 客户端 bundle 的门控与宿主能力路由（node --test，无 DOM 依赖）。
      - name: Test JS bundles (client gate + host capability route)
        run: npm run test:js

      # DSH 组合包/客户端契约：manifest、patch 按包名引用、files 覆盖、经典脚本约束、peer 声明等。
      - name: Check DSH package contract
        run: npm run check:dsh

      # 防止只改 src/index.ts 而忘了重新编译：编译产物若与已提交的 lib/ 不一致则失败。
      - name: Verify compiled lib/ is in sync
        run: |
          if [ -n "$(git status --porcelain -- lib/)" ]; then
            echo "::error::lib/ 与 src 编译产物不一致 —— 请运行 \`npm run build\` 并提交 lib/index.js。"
            echo "--- git diff lib/ ---"
            git diff -- lib/
            exit 1
          fi
          echo "lib/ is in sync with src/index.ts."

  # Python 纯逻辑单测（encoding/detect：只依赖 PIL，跨平台），在 Ubuntu + macOS 都跑。
  test-py:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Run python unit tests (pure logic)
        run: python -m unittest discover -s tests -v

  # 打 v* tag（如 v0.1.0）时发布：构建+测试通过后 npm pack 出 tgz 并创建 GitHub Release。
  release:
    runs-on: ubuntu-latest
    needs: [build, test-py]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Build (tsc -> lib/index.js)
        run: npm run build

      - name: Pack tarball
        run: npm pack

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vision-*.tgz
          generate_release_notes: true
